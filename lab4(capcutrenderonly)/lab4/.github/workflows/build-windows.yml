name: Build Windows Client and Server EXEs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build one-file executables
        run: python scripts/build_windows.py

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: CSC334-Windows-EXEs
          path: release/*
          if-no-files-found: error
